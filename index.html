<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="คิวเพื่อน ค.ศ.2-3" />
  <meta name="theme-color" content="#FFF5F8" />
  <title>🌸 สมุดจำคิวเพื่อนครู ค.ศ.2 & ค.ศ.3 | ครูเกียรติศักดิ์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #FFF7FA;
      --bg-card: #FFFFFF;
      --text-main: #3B2C35;
      --text-sub: #7A6571;

      --pink-primary: #EC4899;
      --pink-light: #FCE7F3;
      --pink-border: #F9A8D4;

      --sky-primary: #0284C7;
      --sky-light: #E0F2FE;
      --sky-border: #7DD3FC;

      --orange-primary: #EA580C;
      --orange-light: #FFEDD5;
      --orange-border: #FDBA74;

      --amber-primary: #D97706;
      --amber-light: #FEF3C7;
      --amber-border: #FCD34D;

      --mint-primary: #059669;
      --mint-light: #D1FAE5;
      --mint-border: #6EE7B7;

      --lavender-light: #F3E8FF;
      --lavender-border: #D8B4FE;
      --lavender-text: #6B21A8;
    }

    /* บังคับใช้ฟอนต์ Itim (ไอติม) ทั้งเว็บไซต์ 100% ทุกตัวอักษรและทุกปุ่ม */
    *, *::before, *::after,
    body, h1, h2, h3, h4, p, span, div, a,
    button, input, select, textarea, label {
      font-family: 'Itim', -apple-system, BlinkMacSystemFont, sans-serif !important;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      background-image:
        radial-gradient(#FBCFE8 1.2px, transparent 1.2px),
        radial-gradient(#BAE6FD 1.2px, #FFF7FA 1.2px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: var(--text-main);
      line-height: 1.5;
      padding: 10px 10px 80px 10px;
      min-height: 100vh;
    }

    .app-shell {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 1. Compact Cute Top Header */
    .top-bar {
      background: linear-gradient(135deg, #FCE7F3 0%, #FEF3C7 55%, #D1FAE5 100%);
      border: 2.5px solid var(--pink-border);
      border-radius: 22px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 4px 0 rgba(244, 114, 182, 0.18);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar-badge {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #EC4899, #F43F5E);
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 6px rgba(236, 72, 153, 0.25);
    }

    .brand-title {
      font-size: 17px;
      color: var(--text-main);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 12.5px;
      color: #BE185D;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Cute Bouncy Buttons */
    .btn {
      font-size: 14px;
      padding: 7px 13px;
      border-radius: 999px;
      border: 2px solid #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 0.1s ease;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12);
    }

    .btn-pink {
      background: linear-gradient(135deg, #EC4899, #F43F5E);
      color: #FFFFFF;
      box-shadow: 0 3px 0 #BE185D;
    }

    .btn-mint {
      background: var(--mint-light);
      color: #065F46;
      border-color: var(--mint-border);
      box-shadow: 0 3px 0 #6EE7B7;
    }

    .btn-amber {
      background: var(--amber-light);
      color: #92400E;
      border-color: var(--amber-border);
      box-shadow: 0 3px 0 #FCD34D;
    }

    .btn-lavender {
      background: var(--lavender-light);
      color: var(--lavender-text);
      border-color: var(--lavender-border);
      box-shadow: 0 3px 0 #D8B4FE;
    }

    .btn-sm {
      font-size: 13px;
      padding: 5px 11px;
    }

    /* 2. GoodNotes-Style Folder Tabs Bar (Scrollable Horizontal Tabs) */
    .tabs-wrapper {
      background: #FFFFFF;
      border: 2.5px solid var(--pink-border);
      border-radius: 22px;
      padding: 8px;
      box-shadow: 0 4px 0 rgba(249, 168, 212, 0.22);
      position: sticky;
      top: 6px;
      z-index: 30;
    }

    .tabs-label {
      font-size: 12px;
      color: var(--text-sub);
      padding: 0 6px 4px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tabs-scroll {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 3px;
      scrollbar-width: none;
    }

    .tabs-scroll::-webkit-scrollbar {
      display: none;
    }

    .tab-chip {
      padding: 7px 14px;
      border-radius: 999px;
      border: 2px solid #FBCFE8;
      background: #FFF5F8;
      color: var(--text-main);
      font-size: 14.5px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .tab-chip.tab-ks2 {
      border-color: var(--sky-border);
      background: #F0F9FF;
    }

    .tab-chip.tab-ks3 {
      border-color: var(--orange-border);
      background: #FFF7ED;
    }

    .tab-chip.active {
      background: linear-gradient(135deg, #EC4899, #F43F5E);
      color: #FFFFFF;
      border-color: #FFFFFF;
      box-shadow: 0 3px 8px rgba(236, 72, 153, 0.35);
      transform: translateY(-1px);
    }

    .tab-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F59E0B;
      display: inline-block;
    }

    .tab-chip.active .tab-dot {
      background: #FEF08A;
    }

    /* 3. Overview Tab Content */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .mini-stat {
      background: #FFFFFF;
      border: 2px solid var(--pink-border);
      border-radius: 18px;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.04);
    }

    .mini-stat.active {
      outline: 2.5px solid #EC4899;
      background: #FFF0F6;
    }

    .mini-stat-label {
      font-size: 12px;
      color: var(--text-sub);
      display: block;
    }

    .mini-stat-num {
      font-size: 18px;
      color: var(--text-main);
    }

    /* Urgent Radar Card in Overview */
    .radar-card {
      background: #FFFBEB;
      border: 2.5px solid var(--amber-border);
      border-radius: 22px;
      padding: 12px 14px;
      box-shadow: 0 4px 0 rgba(251, 191, 36, 0.2);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .radar-row {
      background: #FFFFFF;
      border: 2px solid var(--amber-border);
      border-radius: 16px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Directory List in Overview */
    .directory-card {
      background: #FFFFFF;
      border: 2.5px solid var(--lavender-border);
      border-radius: 22px;
      padding: 12px;
      box-shadow: 0 4px 0 rgba(216, 180, 254, 0.25);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-row {
      display: flex;
      gap: 6px;
    }

    .input-cute {
      width: 100%;
      padding: 8px 12px;
      border-radius: 14px;
      border: 2px solid var(--pink-border);
      background: #FFFDF9;
      font-size: 14.5px;
      color: var(--text-main);
    }

    .input-cute:focus {
      outline: none;
      border-color: var(--pink-primary);
      background: #FFFFFF;
    }

    .friend-row-item {
      background: #FFFDF9;
      border: 2px solid #F3E8FF;
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.1s ease;
    }

    .friend-row-item:hover, .friend-row-item:active {
      border-color: var(--pink-border);
      background: #FFF5F8;
    }

    /* 4. Single Friend Tab View (GoodNotes Personal Page) */
    .person-page {
      background: #FFFFFF;
      border: 3px solid var(--pink-border);
      border-radius: 26px;
      padding: 16px;
      box-shadow: 0 7px 0 rgba(249, 168, 212, 0.28);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .person-page.theme-ks2 {
      border-color: var(--sky-border);
      box-shadow: 0 7px 0 rgba(125, 211, 252, 0.28);
    }

    .person-page.theme-ks3 {
      border-color: var(--orange-border);
      box-shadow: 0 7px 0 rgba(253, 186, 116, 0.28);
    }

    .person-nav-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-bottom: 8px;
      border-bottom: 2px dashed #FBCFE8;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 13px;
    }

    .pill-ks2 {
      background: var(--sky-light);
      color: #0369A1;
      border: 1.5px solid var(--sky-border);
    }

    .pill-ks3 {
      background: var(--orange-light);
      color: #C2410C;
      border: 1.5px solid var(--orange-border);
    }

    .pill-status {
      background: var(--pink-light);
      color: #BE185D;
      border: 1.5px solid var(--pink-border);
    }

    .countdown-banner {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      border: 2px solid var(--sky-border);
      background: var(--sky-light);
      color: #0369A1;
    }

    .countdown-banner.urgent {
      background: var(--pink-light);
      border-color: var(--pink-border);
      color: #BE185D;
    }

    .countdown-banner.soon {
      background: var(--amber-light);
      border-color: var(--amber-border);
      color: #92400E;
    }

    .countdown-banner.ready {
      background: var(--mint-light);
      border-color: var(--mint-border);
      color: #065F46;
    }

    .notebook-box {
      background: #FFFBEB;
      border: 2px dashed var(--amber-border);
      border-radius: 20px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 15px;
    }

    .notebook-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #FDE68A;
    }

    .notebook-line:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .notebook-key {
      color: #92400E;
      min-width: 118px;
      flex-shrink: 0;
    }

    .progress-track {
      width: 100%;
      height: 11px;
      background: #FCE7F3;
      border-radius: 99px;
      overflow: hidden;
      margin: 6px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #F472B6, #FBBF24, #34D399);
      border-radius: 99px;
      transition: width 0.25s ease;
    }

    .chk-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .chk-card {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 14px;
      border: 2px solid #E5E7EB;
      background: #FAFAFA;
      font-size: 14px;
      cursor: pointer;
    }

    .chk-card.done {
      border-color: var(--mint-border);
      background: var(--mint-light);
      color: #065F46;
    }

    .chk-card input {
      accent-color: #EC4899;
      width: 16px;
      height: 16px;
    }

    .memo-box {
      background: #FFF0F6;
      border-left: 4px solid #EC4899;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 14.5px;
      color: var(--text-main);
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(59, 44, 53, 0.55);
      backdrop-filter: blur(3px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-y: auto;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #FFFFFF;
      border: 3px solid var(--pink-border);
      border-radius: 26px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .col-full {
      grid-column: 1 / -1;
    }

    @media (max-width: 480px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-label {
      display: block;
      font-size: 13.5px;
      color: #BE185D;
      margin-bottom: 3px;
    }

    .tag-btn {
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 99px;
      border: 1.5px solid var(--pink-border);
      background: var(--pink-light);
      color: #BE185D;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 18px;
      right: 18px;
      max-width: 340px;
      margin: 0 auto;
      background: #EC4899;
      color: #FFFFFF;
      border: 2px solid #FFFFFF;
      padding: 10px 16px;
      border-radius: 99px;
      font-size: 14.5px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(236, 72, 153, 0.4);
      z-index: 200;
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">

    <!-- 1. Compact Header -->
    <header class="top-bar">
      <div class="brand-left">
        <div class="avatar-badge">
          <span style="font-size:18px;line-height:1;">🧑🏻‍🏫</span>
          <span style="font-size:10px;line-height:1;">ค.ศ.3</span>
        </div>
        <div style="min-width:0;">
          <h1 class="brand-title">🌸 สมุดจำคิวเพื่อนทำ ค.ศ.2-3</h1>
          <div class="brand-sub">ครูเกียรติศักดิ์ กรุณา (9,999 กิจกรรม) ✨</div>
        </div>
      </div>

      <div class="top-actions">
        <a href="https://docs.google.com/spreadsheets/d/1JW35O0ZLsJ0lxno5jOxTR3A34vGCv4ljdsfo_CylVys/edit" target="_blank" rel="noopener" class="btn btn-mint btn-sm" title="เปิดตาราง Google Sheets">
          📗 ชีต
        </a>
        <button type="button" class="btn btn-pink btn-sm" onclick="openFriendModal()">
          ➕ เพิ่มเพื่อน
        </button>
      </div>
    </header>

    <!-- 2. Sticky Notebook Folder Tabs (Overview + Each Friend's Individual Tab!) -->
    <nav class="tabs-wrapper" aria-label="แถบสลับหน้า">
      <div class="tabs-label">
        <span>🗂️ แตะเลือกแท็บแดชบอร์ด หรือชื่อเพื่อนเพื่อดูรายคน (ไม่ต้องไถยาว!)</span>
        <span id="tab-counter">4 คน</span>
      </div>
      <div id="tabs-bar" class="tabs-scroll"></div>
    </nav>

    <!-- 3. Dynamic Main Content Area (Either Overview OR Single Friend Page) -->
    <main id="main-view"></main>

  </div>

  <!-- Add / Edit Friend Modal -->
  <div id="friend-modal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed #FBCFE8;padding-bottom:8px;">
        <h3 id="modal-title" style="font-size:18px;color:#BE185D;">🌸 เพิ่มข้อมูลเพื่อนครู</h3>
        <button type="button" class="btn btn-lavender btn-sm" onclick="closeFriendModal()">✕ ปิด</button>
      </div>

      <form id="friend-form" onsubmit="saveFriendForm(event)" style="display:flex;flex-direction:column;gap:10px;">
        <input type="hidden" id="f-id" />

        <div class="form-grid">
          <div>
            <label class="form-label">🎀 ชื่อเพื่อน / ชื่อเล่น *</label>
            <input type="text" id="f-name" required class="input-cute" placeholder="เช่น ครูเมย์ (ธนพร)" />
          </div>
          <div>
            <label class="form-label">🏫 โรงเรียน / สังกัด</label>
            <input type="text" id="f-school" class="input-cute" placeholder="เช่น รร.วัดคลองห้า" />
          </div>
          <div>
            <label class="form-label">🌈 ระดับที่จะทำ *</label>
            <select id="f-rank" class="input-cute">
              <option value="ค.ศ.2">📘 ค.ศ.2 (ครูชำนาญการ)</option>
              <option value="ค.ศ.3">👑 ค.ศ.3 (ครูชำนาญการพิเศษ)</option>
            </select>
          </div>
          <div>
            <label class="form-label">📅 วันที่ครบกำหนดยื่นได้ *</label>
            <input type="date" id="f-date" required class="input-cute" />
          </div>
          <div>
            <label class="form-label">📱 ช่องทางติดต่อ (Line / FB)</label>
            <input type="text" id="f-contact" class="input-cute" placeholder="เช่น Line: may_kru" />
          </div>
          <div>
            <label class="form-label">✨ สถานะปัจจุบัน</label>
            <select id="f-status" class="input-cute">
              <option value="รอถึงกำหนด">⏳ รอถึงกำหนด</option>
              <option value="ถึงเวลาทักถามข้อมูล">💬 ถึงเวลาทักถามข้อมูล</option>
              <option value="กำลังวางแผน/ให้คำปรึกษา">🧭 กำลังวางแผน/ให้คำปรึกษา</option>
              <option value="กำลังทำเอกสาร/อัดคลิป">🎥 กำลังทำเอกสาร/อัดคลิป</option>
              <option value="ยื่น DPA แล้ว">🚀 ยื่น DPA แล้ว</option>
              <option value="ผ่านแล้ว 🎉">🟢 ผ่านแล้ว 🎉</option>
            </select>
          </div>
          <div>
            <label class="form-label">📚 วิชา / กลุ่มสาระ</label>
            <input type="text" id="f-subject" class="input-cute" placeholder="เช่น ภาษาไทย, คณิตศาสตร์" />
          </div>
          <div>
            <label class="form-label">🎒 ระดับชั้นที่สอน</label>
            <input type="text" id="f-grade" class="input-cute" placeholder="เช่น ป.4, ป.5, ม.1" />
          </div>
          <div class="col-full">
            <label class="form-label">🎯 อยากทำเรื่องอะไร? (หน่วยการเรียนรู้ / เรื่องที่สอน)</label>
            <input type="text" id="f-topic" class="input-cute" placeholder="เช่น การอ่านจับใจความสำคัญ, การบวกลบเศษส่วน" />
          </div>
          <div class="col-full">
            <label class="form-label">💡 ใช้นวัตกรรม หรือ วิธีการสอนแบบไหน?</label>

        <button type="button" class="btn btn-amber btn-sm" onclick="closeMsgModal()">✕</button>
      </div>
      <div id="msg-box" style="background:#FFFBEB;border:2px solid var(--amber-border);border-radius:18px;padding:13px;font-size:15px;white-space:pre-wrap;line-height:1.6;"></div>
      <div style="display:flex;justify-content:space-between;gap:8px;">
        <button type="button" class="btn btn-lavender btn-sm" onclick="editFromMsgModal()">✏️ กรอกคำตอบเพื่อน</button>
        <button type="button" class="btn btn-pink btn-sm" onclick="copyChatMsg()">📋 คัดลอกข้อความ</button>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = 'kru_kiattisak_dpa_friends_v1';
    const THAI_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

      { key: 'คลิปการสอน', label: '🎬 2. คลิป 60 นาที' },
      { key: 'ผลลัพธ์ผู้เรียน', label: '🌟 3. ผลลัพธ์ผู้เรียน' },
      { key: 'ระบบ PA/DPA', label: '🟢 4. ระบบ DPA' }
    ];

    const DEFAULT_FRIENDS = [
      {
        id: 'friend_1',
        name: 'ครูเมย์ (ธนพร)',
        school: 'รร.วัดคลองห้า (สพป.สระบุรี เขต 2)',
        rank: 'ค.ศ.2',
        targetDate: '2026-11-25',
        contact: 'Line: may_kru',
        status: 'ถึงเวลาทักถามข้อมูล',
        subject: 'ภาษาไทย',
        grade: '',
        topic: '',
        innovation: '',
        checklist: ['แผนการสอน'],
        notes: 'เคยคุยกันตอนงานเขตว่าครบกำหนดปลายเดือน พ.ย. 69 ต้องทักไปถามว่าจะทำเรื่องอะไร สอนชั้นไหน และใช้นวัตกรรมอะไร'
      },
      {
        id: 'friend_2',
        name: 'ครูบอย (อนุชา)',
        school: 'รร.บ้านหนองยาว',
        rank: 'ค.ศ.3',
        targetDate: '2026-12-10',
        contact: 'FB: Anucha Boy',
        status: 'ถึงเวลาทักถามข้อมูล',
        subject: 'คณิตศาสตร์',
        grade: 'ป.5',
        topic: '',
        innovation: '',
        checklist: ['แผนการสอน'],
        notes: 'เลือกชั้น ป.5 ไว้แล้ว แต่ยังลังเลเรื่องเศษส่วนกับทศนิยม รอทักถามสรุปหัวข้อและวิธีสอน'
      },
      {
        id: 'friend_3',
        name: 'ครูส้ม (พัชรี)',
        school: 'รร.ชุมชนวัดไทยงาม',
        rank: 'ค.ศ.2',
        targetDate: '2026-11-18',
        contact: 'Line: som_patcharee',
        status: 'กำลังทำเอกสาร/อัดคลิป',
        subject: 'วิทยาศาสตร์และเทคโนโลยี',
        grade: 'ป.4',
        topic: 'หน้าที่ของส่วนต่างๆ ของพืชดอก',
        innovation: 'สืบเสาะ 5E + ชุดกิจกรรมการเรียนรู้',
        checklist: ['แผนการสอน', 'คลิปการสอน', 'ผลลัพธ์ผู้เรียน'],
        notes: 'ปรึกษาเรื่องตัดต่อต้นคลิปและตรวจแผนการสอนเรียบร้อย เหลืออัปโหลดเข้าระบบ DPA'
      },
      {
        id: 'friend_4',
        name: 'ครูต้น (วีรภัทร)',
        school: 'รร.อนุบาลสระบุรี',
        rank: 'ค.ศ.3',
        targetDate: '2027-03-15',
        contact: 'FB: Weeraphat Ton',
        status: 'รอถึงกำหนด',
        subject: 'สังคมศึกษาฯ',
        grade: 'ป.6',
        topic: 'เศรษฐศาสตร์ในชีวิตประจำวัน',
        innovation: 'Active Learning + บอร์ดเกม / Gamification',
        checklist: ['แผนการสอน'],
        notes: 'ครบกำหนดมีนาคมปีหน้า เริ่มวางโครงบอร์ดเกมและวิจัยในชั้นเรียนล่วงหน้าแล้ว'
      }
    ];

    let friends = [];
    let activeTab = 'overview'; // 'overview' OR friend.id
    let overviewFilter = 'all'; // 'all' | 'consult' | 'ค.ศ.2' | 'ค.ศ.3'
    let searchQuery = '';
    let activeMsgFriendId = null;

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        friends = raw ? JSON.parse(raw) : DEFAULT_FRIENDS;
      } catch (e) {
        friends = DEFAULT_FRIENDS;
      }
      renderApp();
    }

    function saveData(msg) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(friends));
      renderApp();
      if (msg) showToast(msg);
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 2500);
    }

    function formatThaiDate(dateStr) {
      if (!dateStr) return '-';
      const p = dateStr.split('-');
      if (p.length !== 3) return dateStr;
      return `${parseInt(p[2], 10)} ${THAI_MONTHS[parseInt(p[1], 10) - 1] || ''} ${parseInt(p[0], 10) + 543}`;
    }

    function getDaysUntil(dateStr) {
      if (!dateStr) return 9999;
      const now = new Date();
      const todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      const p = dateStr.split('-');
      if (p.length !== 3) return 9999;
      const targetUTC = Date.UTC(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
      return Math.round((targetUTC - todayUTC) / 86400000);
    }

    function needsConsult(f) {
      if (f.status === 'ยื่น DPA แล้ว' || f.status === 'ผ่านแล้ว 🎉') return false;
      const days = getDaysUntil(f.targetDate);
      const missing = !f.topic?.trim() || !f.grade?.trim() || !f.innovation?.trim();
      return (days <= 90 && missing) || f.status === 'ถึงเวลาทักถามข้อมูล';
    }

    function getCountdownBadge(f) {
      if (f.status === 'ผ่านแล้ว 🎉') return { text: '🟢 อนุมัติผ่านแล้ว (ป้ายเขียว!)', cls: 'ready' };
      if (f.status === 'ยื่น DPA แล้ว') return { text: '🚀 ยื่น DPA แล้ว รอลุ้นป้ายเขียว!', cls: 'ready' };
      const d = getDaysUntil(f.targetDate);
      if (d < 0) return { text: `🍓 ยื่นได้แล้วน้า! (ผ่านมา ${Math.abs(d)} วัน)`, cls: 'urgent' };
      if (d === 0) return { text: '🎉 ครบกำหนดยื่นวันนี้วันแรก!', cls: 'urgent' };
      if (d <= 30) return { text: `⏰ อีก ${d} วันจะยื่นได้!`, cls: 'urgent' };
      if (d <= 90) return { text: `🍋 อีก ${d} วันครบกำหนด`, cls: 'soon' };
      return { text: `🌱 อีก ${d} วัน (${Math.round(d / 30)} เดือน)`, cls: '' };
    }

    function shortName(fullName) {
      if (!fullName) return 'เพื่อนครู';
      return fullName.split('(')[0].trim();
    }

    function selectTab(tabId) {
      activeTab = tabId;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setOverviewFilter(mode) {
      overviewFilter = mode;
      renderApp();
    }

    function renderTabsBar() {
      const bar = document.getElementById('tabs-bar');
      document.getElementById('tab-counter').textContent = `ทั้งหมด ${friends.length} คน`;

      const sorted = [...friends].sort((a, b) => getDaysUntil(a.targetDate) - getDaysUntil(b.targetDate));

      let html = `
        <button type="button" class="tab-chip ${activeTab === 'overview' ? 'active' : ''}" onclick="selectTab('overview')">
          <span>📊 แดชบอร์ดรวม</span>
        </button>
      `;

      html += sorted.map(f => {
        const isActive = activeTab === f.id;
        const urgent = needsConsult(f);
        const rankIcon = f.rank === 'ค.ศ.3' ? '👑' : '📘';
        const rankCls = f.rank === 'ค.ศ.3' ? 'tab-ks3' : 'tab-ks2';
        return `
          <button type="button" class="tab-chip ${rankCls} ${isActive ? 'active' : ''}" onclick="selectTab('${f.id}')">
            <span>${rankIcon} ${esc(shortName(f.name))}</span>
            ${urgent ? '<span class="tab-dot" title="ใกล้ครบกำหนด/รอทักถาม"></span>' : ''}
          </button>
        `;
      }).join('');

      html += `
        <button type="button" class="tab-chip" style="border-style:dashed;" onclick="openFriendModal()">
          <span>➕ เพิ่มคนใหม่</span>
        </button>
      `;

      bar.innerHTML = html;
    }

    function renderOverview() {
      const consultList = friends.filter(needsConsult).sort((a, b) => getDaysUntil(a.targetDate) - getDaysUntil(b.targetDate));
      const ks2Count = friends.filter(f => f.rank === 'ค.ศ.2').length;
      const ks3Count = friends.filter(f => f.rank === 'ค.ศ.3').length;

      const filtered = friends
        .filter(f => {
          if (overviewFilter === 'consult' && !needsConsult(f)) return false;
          if ((overviewFilter === 'ค.ศ.2' || overviewFilter === 'ค.ศ.3') && f.rank !== overviewFilter) return false;
          if (searchQuery) {
            const hay = [f.name, f.school, f.subject, f.grade, f.topic, f.innovation, f.notes].join(' ').toLowerCase();
            if (!hay.includes(searchQuery.toLowerCase())) return false;
          }
          return true;
        })
        .sort((a, b) => getDaysUntil(a.targetDate) - getDaysUntil(b.targetDate));

      let radarHtml = '';
      if (consultList.length > 0) {
        radarHtml = `
          <section class="radar-card">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
              <h2 style="font-size:16px;color:#92400E;">📣 คิวเพื่อนใกล้ครบกำหนด — ต้องทักถามแผนทำผลงาน (${consultList.length} คน)</h2>
            </div>
            ${consultList.map(f => {
              const d = getDaysUntil(f.targetDate);
              const dayTxt = d < 0 ? `ครบแล้ว (${formatThaiDate(f.targetDate)})` : `อีก ${d} วัน (${formatThaiDate(f.targetDate)})`;
              return `
                <div class="radar-row">
                  <div onclick="selectTab('${f.id}')" style="cursor:pointer;flex:1;min-width:160px;">
                    <div style="font-size:15.5px;color:var(--text-main);">
                      <strong>${esc(f.name)}</strong>
                      <span class="pill ${f.rank === 'ค.ศ.3' ? 'pill-ks3' : 'pill-ks2'}" style="padding:1px 8px;font-size:12px;">${esc(f.rank)}</span>
                    </div>
                    <div style="font-size:13px;color:#B45309;">📅 ${dayTxt} &bull; 🌷 แตะเพื่อเปิดหน้าของเพื่อน</div>
                  </div>
                  <div style="display:flex;gap:6px;flex-shrink:0;">
                    <button type="button" class="btn btn-pink btn-sm" onclick="openMsgModal('${f.id}')">💬 ทักถาม</button>
                    <button type="button" class="btn btn-amber btn-sm" onclick="selectTab('${f.id}')">👉 ดูแท็บ</button>
                  </div>
                </div>
              `;
            }).join('')}
          </section>
        `;
      }

      return `
        <div style="display:flex;flex-direction:column;gap:10px;">
          <!-- 4 Compact Summary Boxes -->
          <section class="stats-strip">
            <div class="mini-stat ${overviewFilter === 'all' ? 'active' : ''}" onclick="setOverviewFilter('all')">
              <span class="mini-stat-label">🧸 ทั้งหมด</span>
              <div class="mini-stat-num">${friends.length} คน</div>
            </div>
            <div class="mini-stat ${overviewFilter === 'consult' ? 'active' : ''}" style="border-color:var(--amber-border);" onclick="setOverviewFilter('consult')">
              <span class="mini-stat-label" style="color:#B45309;">🔔 ทักถาม</span>
              <div class="mini-stat-num" style="color:#D97706;">${consultList.length} คน</div>
            </div>
            <div class="mini-stat ${overviewFilter === 'ค.ศ.2' ? 'active' : ''}" style="border-color:var(--sky-border);" onclick="setOverviewFilter('ค.ศ.2')">
              <span class="mini-stat-label" style="color:#0369A1;">📘 ค.ศ.2</span>
              <div class="mini-stat-num" style="color:#0284C7;">${ks2Count} คน</div>
            </div>
            <div class="mini-stat ${overviewFilter === 'ค.ศ.3' ? 'active' : ''}" style="border-color:var(--orange-border);" onclick="setOverviewFilter('ค.ศ.3')">
              <span class="mini-stat-label" style="color:#C2410C;">👑 ค.ศ.3</span>
              <div class="mini-stat-num" style="color:#EA580C;">${ks3Count} คน</div>
            </div>
          </section>

          ${radarHtml}

          <!-- Compact Friend Directory (Click any friend to jump to their tab!) -->
          <section class="directory-card">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <h2 style="font-size:16px;color:var(--lavender-text);">📋 รายชื่อเพื่อนทั้งหมด (แตะชื่อเพื่อเปิดดูรายคน)</h2>
            </div>

            <div class="search-row">
              <input
                type="search"
                class="input-cute"
                placeholder="🔍 ค้นหาชื่อเพื่อน, โรงเรียน, วิชา, เรื่องที่จะทำ..."
                value="${esc(searchQuery)}"
                oninput="searchQuery = this.value; renderApp();"
              />
            </div>

            <div style="display:flex;flex-direction:column;gap:7px;">
              ${filtered.length === 0 ? `
                <div style="text-align:center;padding:20px;color:var(--text-sub);">
                  🌸 ไม่พบรายชื่อเพื่อนในหมวดนี้จ้า
                </div>
              ` : filtered.map(f => {
                const cd = getCountdownBadge(f);
                const chk = Array.isArray(f.checklist) ? f.checklist : [];
                return `
                  <div class="friend-row-item" onclick="selectTab('${f.id}')">
                    <div style="min-width:0;flex:1;">
                      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                        <span style="font-size:16px;"><strong>${esc(f.name)}</strong></span>
                        <span class="pill ${f.rank === 'ค.ศ.3' ? 'pill-ks3' : 'pill-ks2'}" style="padding:1px 8px;font-size:12px;">
                          ${f.rank === 'ค.ศ.3' ? '👑 ค.ศ.3' : '📘 ค.ศ.2'}
                        </span>
                        <span style="font-size:12.5px;color:#BE185D;">&bull; 📅 ${formatThaiDate(f.targetDate)} (${cd.text})</span>
                      </div>
                      <div style="font-size:13.5px;color:var(--text-sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                        📚 ${esc(f.subject || 'ยังไม่ระบุวิชา')} ${f.grade ? `(${esc(f.grade)})` : ''} &bull;
                        ${f.topic ? `🎯 ${esc(f.topic)}` : '<span style="color:#DB2777;">🌷 รอถามเรื่องที่จะทำ</span>'}
                      </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                      <span class="pill" style="background:#F3E8FF;color:#6B21A8;font-size:12px;">เอกสาร ${chk.length}/4</span>
                      <span style="font-size:15px;color:#EC4899;">👉</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        </div>
      `;
    }

    function renderSingleFriendPage(friendId) {
      const sorted = [...friends].sort((a, b) => getDaysUntil(a.targetDate) - getDaysUntil(b.targetDate));
      const idx = sorted.findIndex(x => x.id === friendId);
      const f = sorted[idx];
      if (!f) {
        activeTab = 'overview';
        return renderOverview();
      }

      const prevFriend = idx > 0 ? sorted[idx - 1] : null;
      const nextFriend = idx < sorted.length - 1 ? sorted[idx + 1] : null;

      const cd = getCountdownBadge(f);
      const chk = Array.isArray(f.checklist) ? f.checklist : [];
      const pct = Math.round((chk.length / 4) * 100);
      const themeCls = f.rank === 'ค.ศ.3' ? 'theme-ks3' : 'theme-ks2';

      return `
        <article class="person-page ${themeCls}">
          <!-- Quick Prev / Next Friend Switcher -->
          <div class="person-nav-strip">
            <button type="button" class="btn btn-lavender btn-sm" onclick="selectTab('overview')">
              ⬅ กลับหน้าแดชบอร์ด
            </button>
            <div style="display:flex;gap:5px;">
              ${prevFriend ? `<button type="button" class="btn btn-amber btn-sm" onclick="selectTab('${prevFriend.id}')">◀ ${esc(shortName(prevFriend.name))}</button>` : ''}
              ${nextFriend ? `<button type="button" class="btn btn-amber btn-sm" onclick="selectTab('${nextFriend.id}')">${esc(shortName(nextFriend.name))} ▶</button>` : ''}
            </div>
          </div>

          <!-- Friend Identity Header -->
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">
            <div>
              <h2 style="font-size:21px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span>${esc(f.name)}</span>
                <span class="pill ${f.rank === 'ค.ศ.3' ? 'pill-ks3' : 'pill-ks2'}">
                  ${f.rank === 'ค.ศ.3' ? '👑 ค.ศ.3 ชำนาญการพิเศษ' : '📘 ค.ศ.2 ชำนาญการ'}
                </span>
              </h2>
              <div style="font-size:14px;color:var(--text-sub);margin-top:3px;">
                🏫 ${esc(f.school || 'ยังไม่ได้ระบุโรงเรียน')} ${f.contact ? `&bull; 📱 ${esc(f.contact)}` : ''}
              </div>
            </div>
            <span class="pill pill-status">${esc(f.status || 'รอถึงกำหนด')}</span>
          </div>

          <!-- Countdown Strip -->
          <div class="countdown-banner ${cd.cls}">
            <span>📅 วันที่ครบกำหนดยื่นได้: <strong>${formatThaiDate(f.targetDate)}</strong></span>
            <span>${cd.text}</span>
          </div>

          <!-- Quick Action Buttons -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button type="button" class="btn btn-amber" onclick="openMsgModal('${f.id}')">
              💬 ทักถามเพื่อนในแชท
            </button>
            <button type="button" class="btn btn-pink" onclick="openFriendModal('${f.id}')">
              ✏️ แก้ไข / กรอกคำตอบ
            </button>
          </div>

          <!-- GoodNotes Style Consultation Sheet -->
          <div class="notebook-box">
            <div style="font-size:15.5px;color:#B45309;display:flex;justify-content:space-between;align-items:center;">
              <span>📒 สมุดบันทึกแผนการทำผลงาน (สำหรับการให้คำปรึกษา)</span>
            </div>
            <div class="notebook-line">
              <span class="notebook-key">📚 วิชา / กลุ่มสาระ:</span>
              <span>${esc(f.subject || 'ยังไม่ระบุวิชา')}</span>
            </div>
            <div class="notebook-line">
              <span class="notebook-key">🎒 ระดับชั้นที่สอน:</span>
              <span>${f.grade ? `ชั้น ${esc(f.grade)}` : '<span style="color:#D97706;">ยังไม่ระบุชั้นเรียน</span>'}</span>
            </div>
            <div class="notebook-line">
              <span class="notebook-key">🎯 เรื่องที่จะทำ:</span>
              <span>
                ${f.topic
                  ? `<strong>${esc(f.topic)}</strong>`
                  : `<span style="color:#DB2777;">🌷 ยังไม่ได้สรุปเรื่องที่จะทำ</span> <button type="button" class="tag-btn" onclick="openFriendModal('${f.id}')">+ กรอกเรื่อง</button>`}
              </span>
            </div>
            <div class="notebook-line">
              <span class="notebook-key">💡 นวัตกรรม/วิธีสอน:</span>
              <span>
                ${f.innovation
                  ? `<strong>${esc(f.innovation)}</strong>`
                  : `<span style="color:#D97706;">ยังไม่ได้เลือกนวัตกรรมหรือวิธีสอน</span> <button type="button" class="tag-btn" onclick="openFriendModal('${f.id}')">+ เลือกนวัตกรรม</button>`}
              </span>
            </div>
          </div>

          <!-- DPA 4-Step Checklist -->
          <div>
            <div style="display:flex;justify-content:space-between;font-size:14px;color:#059669;">
              <span>✅ เช็กลิสต์เอกสาร DPA (${chk.length}/4 รายการ)</span>
              <span>${pct}%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${pct}%"></div>
            </div>
            <div class="chk-grid">
              ${CHECKLIST_OPTS.map(item => {
                const done = chk.includes(item.key);
                return `
                  <label class="chk-card ${done ? 'done' : ''}">
                    <input type="checkbox" ${done ? 'checked' : ''} onchange="toggleCheck('${f.id}', '${item.key}', this.checked)" />
                    <span>${esc(item.label)}</span>
                  </label>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Coaching Notes -->
          <div class="memo-box">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
              <strong style="color:#BE185D;">📝 บันทึกช่วยจำ / คำแนะนำที่ให้เพื่อน:</strong>
              <button type="button" class="tag-btn" onclick="openFriendModal('${f.id}')">✏️ แก้ไขบันทึก</button>
            </div>
            <div>${f.notes ? esc(f.notes) : 'ยังไม่มีบันทึกเพิ่มเติม กดปุ่มแก้ไขเพื่อจดสิ่งที่คุยกับเพื่อนไว้ได้เลยจ้า'}</div>
          </div>
        </article>
      `;
    }

    function renderApp() {
      renderTabsBar();
      const mainEl = document.getElementById('main-view');
      if (activeTab === 'overview') {
        mainEl.innerHTML = renderOverview();
      } else {
        mainEl.innerHTML = renderSingleFriendPage(activeTab);
      }
    }

    function toggleCheck(id, key, checked) {
      const f = friends.find(x => x.id === id);
      if (!f) return;
      const set = new Set(Array.isArray(f.checklist) ? f.checklist : []);
      if (checked) set.add(key); else set.delete(key);
      f.checklist = Array.from(set);
      saveData(`✨ อัปเดตเช็กลิสต์ของ ${shortName(f.name)} แล้วจ้า!`);
    }

    function addTag(val) {
      const el = document.getElementById('f-innovation');
      if (!el.value.trim()) el.value = val;
      else if (!el.value.includes(val)) el.value = `${el.value.trim()} + ${val}`;
    }

    function openFriendModal(id) {
      const f = id ? friends.find(x => x.id === id) : null;
      document.getElementById('modal-title').textContent = f ? `✏️ แก้ไขข้อมูล: ${f.name}` : '🌸 เพิ่มข้อมูลเพื่อนครู';
      document.getElementById('f-id').value = f ? f.id : '';
      document.getElementById('f-name').value = f ? f.name : '';
      document.getElementById('f-school').value = f ? (f.school || '') : '';
      document.getElementById('f-rank').value = f ? (f.rank || 'ค.ศ.2') : 'ค.ศ.2';
      document.getElementById('f-date').value = f ? (f.targetDate || '') : new Date().toISOString().slice(0, 10);
      document.getElementById('f-contact').value = f ? (f.contact || '') : '';
      document.getElementById('f-status').value = f ? (f.status || 'รอถึงกำหนด') : 'รอถึงกำหนด';
      document.getElementById('f-subject').value = f ? (f.subject || '') : '';
      document.getElementById('f-grade').value = f ? (f.grade || '') : '';
      document.getElementById('f-topic').value = f ? (f.topic || '') : '';
      document.getElementById('f-innovation').value = f ? (f.innovation || '') : '';
      document.getElementById('f-notes').value = f ? (f.notes || '') : '';

      const chk = f && Array.isArray(f.checklist) ? f.checklist : [];
      document.getElementById('c-plan').checked = chk.includes('แผนการสอน');
      document.getElementById('c-video').checked = chk.includes('คลิปการสอน');
      document.getElementById('c-outcome').checked = chk.includes('ผลลัพธ์ผู้เรียน');
      document.getElementById('c-pa').checked = chk.includes('ระบบ PA/DPA');

      document.getElementById('btn-del').style.display = f ? 'inline-flex' : 'none';
      document.getElementById('friend-modal').classList.add('open');
    }

    function closeFriendModal() {
      document.getElementById('friend-modal').classList.remove('open');
    }

    function saveFriendForm(e) {
      e.preventDefault();
      const id = document.getElementById('f-id').value || `friend_${Date.now()}`;
      const checklist = [];
      if (document.getElementById('c-plan').checked) checklist.push('แผนการสอน');
      if (document.getElementById('c-video').checked) checklist.push('คลิปการสอน');
      if (document.getElementById('c-outcome').checked) checklist.push('ผลลัพธ์ผู้เรียน');
      if (document.getElementById('c-pa').checked) checklist.push('ระบบ PA/DPA');

      const item = {
        id,
        name: document.getElementById('f-name').value.trim(),
        school: document.getElementById('f-school').value.trim(),
        rank: document.getElementById('f-rank').value,
        targetDate: document.getElementById('f-date').value,
        contact: document.getElementById('f-contact').value.trim(),
        status: document.getElementById('f-status').value,
        subject: document.getElementById('f-subject').value.trim(),
        grade: document.getElementById('f-grade').value.trim(),
        topic: document.getElementById('f-topic').value.trim(),
        innovation: document.getElementById('f-innovation').value.trim(),
        checklist,
        notes: document.getElementById('f-notes').value.trim()
      };

      const idx = friends.findIndex(x => x.id === id);
      if (idx >= 0) friends[idx] = item; else friends.push(item);
      activeTab = item.id; // Switch directly to this friend's tab!
      closeFriendModal();
      saveData(`🌸 บันทึกและเปิดหน้าของ ${shortName(item.name)} แล้วจ้า!`);
    }

    function deleteCurrentFriend() {
      const id = document.getElementById('f-id').value;
      const f = friends.find(x => x.id === id);
      if (!f) return;
      friends = friends.filter(x => x.id !== id);
      activeTab = 'overview';
      closeFriendModal();
      saveData(`ลบรายชื่อ ${f.name} แล้ว`);
    }

    function openMsgModal(id) {
      const f = friends.find(x => x.id === id);
      if (!f) return;
      activeMsgFriendId = id;
      const d = getDaysUntil(f.targetDate);
      const tDate = formatThaiDate(f.targetDate);
      const rankTxt = f.rank === 'ค.ศ.3' ? 'ค.ศ.3 (ชำนาญการพิเศษ)' : 'ค.ศ.2 (ชำนาญการ)';
      const timeTxt = d < 0
        ? `เห็นว่าครบกำหนดยื่น ${rankTxt} ตั้งแต่วันที่ ${tDate} แล้วนะ!`
        : `เห็นที่คุยกันไว้ว่าจะครบกำหนดยื่น ${rankTxt} วันที่ ${tDate} (อีก ${d} วัน) นี้แล้ว!`;

      const questions = (!f.topic || !f.grade || !f.innovation)
        ? `เลยแวะมาทักถามความคืบหน้าหน่อยครับ จะได้ช่วยกันวางแผนถูก:\n1️⃣ เล็งไว้หรือยังว่าจะทำเรื่องอะไร / หน่วยการเรียนรู้ไหน?\n2️⃣ เลือกอัดคลิปสอนนักเรียนระดับชั้นไหน?\n3️⃣ กะว่าจะใช้นวัตกรรม สื่อ หรือวิธีการสอนแบบไหนเป็นตัวชูโรง? (เช่น Active Learning, GPAS 5 Steps, PBL, บอร์ดเกม ฯลฯ)`
        : `จากที่คุยกันไว้ว่าจะทำเรื่อง "${f.topic}" ชั้น ${f.grade} โดยใช้ "${f.innovation}" ตอนนี้เตรียมแผนการสอน คลิปการสอน 60 นาที กับผลลัพธ์ผู้เรียนไปถึงไหนแล้ว ติดตรงไหนทักมาปรึกษาได้เลยนะครับ!`;

      const fullMsg = `สวัสดีครับ ${f.name}! 😊🌸\n${timeTxt}\n\n${questions}\n\nว่างแล้วพิมพ์บอกไว้ได้เลยนะ เดี๋ยวจดไว้ในสมุดที่ปรึกษาให้ จะได้ช่วยกันลุ้นป้ายเขียว DPA ด้วยกันครับ! 🎉✌🏻🟢`;
      document.getElementById('msg-box').textContent = fullMsg;
      document.getElementById('msg-modal').classList.add('open');
    }

    function closeMsgModal() {
      document.getElementById('msg-modal').classList.remove('open');
    }

    function editFromMsgModal() {
      closeMsgModal();
      if (activeMsgFriendId) openFriendModal(activeMsgFriendId);
    }

    function copyChatMsg() {
      const txt = document.getElementById('msg-box').textContent;
      navigator.clipboard.writeText(txt).then(() => showToast('📋 คัดลอกข้อความทักแชทเรียบร้อยแล้ว!')).catch(() => showToast('คัดลอกแล้ว!'));
    }

    function esc(s) {
      if (!s) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    loadData();
  </script>
</body>
</html>
