    function onCareerDateCalcChange(source) {
      const rank = document.getElementById('f-rank').value || 'ค.ศ.2';
      const reqYears = parseInt(document.getElementById('f-req-years').value, 10) === 3 ? 3 : 4;
      let ks1Date = document.getElementById('f-ks1-date').value;
      let ks2Date = document.getElementById('f-ks2-date').value;
      let targetDate = document.getElementById('f-date').value;

      if (source === 'ks1' && ks1Date) {
        if (rank === 'ค.ศ.2') {
          targetDate = addYearsToDateStr(ks1Date, reqYears);
          document.getElementById('f-date').value = targetDate;
        } else if (rank === 'ค.ศ.3') {
          if (!ks2Date) {
            ks2Date = addYearsToDateStr(ks1Date, reqYears);
            document.getElementById('f-ks2-date').value = ks2Date;
          }
          targetDate = addYearsToDateStr(ks2Date, reqYears);
          document.getElementById('f-date').value = targetDate;
        }
      } else if (source === 'ks2' && ks2Date) {
        if (rank === 'ค.ศ.3') {
          targetDate = addYearsToDateStr(ks2Date, reqYears);
          document.getElementById('f-date').value = targetDate;
        }
      } else if (source === 'rank' || source === 'years') {
        if (rank === 'ค.ศ.2' && ks1Date) {
          targetDate = addYearsToDateStr(ks1Date, reqYears);
          document.getElementById('f-date').value = targetDate;
        } else if (rank === 'ค.ศ.3') {
          if (ks2Date) {
            targetDate = addYearsToDateStr(ks2Date, reqYears);
            document.getElementById('f-date').value = targetDate;
          } else if (ks1Date) {
            ks2Date = addYearsToDateStr(ks1Date, reqYears);
            document.getElementById('f-ks2-date').value = ks2Date;
            targetDate = addYearsToDateStr(ks2Date, reqYears);
            document.getElementById('f-date').value = targetDate;
          }
        }
      }

      const bKs1 = document.getElementById('badge-ks1-thai');
      const bKs2 = document.getElementById('badge-ks2-thai');
      const bTarget = document.getElementById('badge-target-thai');
      const adviceBox = document.getElementById('calc-advice-box');

      if (bKs1) {
        bKs1.innerHTML = ks1Date
          ? `🇹🇭 ตรงกับวันที่ไทย: <strong>${formatThaiDate(ks1Date)}</strong>`
          : `💡 ใส่วันที่เริ่มเป็น ค.ศ.1 ระบบจะบวก +${reqYears} ปีเป็นวันส่ง ค.ศ.2 ให้อัตโนมัติ`;
      }
      if (bKs2) {
        const estKs2 = ks2Date || (ks1Date ? addYearsToDateStr(ks1Date, reqYears) : '');
        bKs2.innerHTML = ks2Date
          ? `🇹🇭 ตรงกับวันที่ไทย: <strong>${formatThaiDate(ks2Date)}</strong>`
          : (estKs2
              ? `💡 คำนวณจากวัน ค.ศ.1 (+${reqYears} ปี) = ครบ ค.ศ.2 วันที่ <strong>${formatThaiDate(estKs2)}</strong>`
              : `💡 ใส่วันที่เริ่มเป็น ค.ศ.2 ระบบจะบวก +${reqYears} ปีเป็นวันส่ง ค.ศ.3 ให้อัตโนมัติ`);
      }
      if (bTarget) {
        bTarget.innerHTML = targetDate
          ? `🇹🇭 ตรงกับวันที่ไทย: <strong>${formatThaiDate(targetDate)}</strong> (${getDaysUntil(targetDate) < 0 ? 'ครบกำหนดยื่นได้แล้ว!' : `อีก ${getDaysUntil(targetDate)} วัน`})`
          : '';
      }

      if (adviceBox) {
        const calcKs2 = ks2Date || (ks1Date ? addYearsToDateStr(ks1Date, reqYears) : '');
        const calcKs3 = rank === 'ค.ศ.3'
          ? (targetDate || (calcKs2 ? addYearsToDateStr(calcKs2, reqYears) : ''))
          : (calcKs2 ? addYearsToDateStr(calcKs2, reqYears) : '');
        const prepDate = targetDate ? addDaysToDateStr(targetDate, -90) : '';

        adviceBox.innerHTML = `
          <div style="font-size:0.98rem;margin-bottom:4px;"><strong>📣 สรุปไทม์ไลน์เพื่อแจ้งเพื่อน (เกณฑ์ ${reqYears} ปี):</strong></div>
          <div>🌱 <strong>วันที่เริ่ม ค.ศ.1:</strong> ${ks1Date ? formatThaiDate(ks1Date) : 'ยังไม่ระบุ'}</div>
          <div>📘 <strong>วันที่เริ่ม/ครบยื่น ค.ศ.2:</strong> ${calcKs2 ? formatThaiDate(calcKs2) : 'ยังไม่ระบุ'}</div>
          <div>👑 <strong>วันที่ครบยื่น ค.ศ.3:</strong> ${calcKs3 ? formatThaiDate(calcKs3) : 'ยังไม่ระบุ'}</div>
          <div style="margin-top:6px;padding-top:6px;border-top:1.5px dashed #6EE7B7;color:#047857;">
            🎬 <strong>ควรเริ่มอัดคลิป/ทำแผน (ล่วงหน้า 3 เดือน):</strong> <strong>${prepDate ? formatThaiDate(prepDate) : '-'}</strong><br/>
            🚀 <strong>วันที่ควรส่งระบบ DPA (${esc(rank)}):</strong> <strong style="color:#BE185D;font-size:1.05rem;">${targetDate ? formatThaiDate(targetDate) : '-'}</strong>
          </div>
        `;
      }
    }

    function buildTimelineAdviceText(nameStr, rank, ks1Date, ks2Date, reqYears, targetDate) {
      const callName = (nameStr && nameStr.trim()) ? nameStr.trim() : 'เพื่อนครู';
      const yrs = parseInt(reqYears, 10) === 3 ? 3 : 4;
      const calcKs2 = ks2Date || (ks1Date ? addYearsToDateStr(ks1Date, yrs) : '');
      const calcKs3 = rank === 'ค.ศ.3'
        ? (targetDate || (calcKs2 ? addYearsToDateStr(calcKs2, yrs) : ''))
        : (calcKs2 ? addYearsToDateStr(calcKs2, yrs) : '');
      const prepDate = targetDate ? addDaysToDateStr(targetDate, -90) : '';
      const d = getDaysUntil(targetDate);
      const countdownTxt = d < 0 ? `(ตอนนี้ครบกำหนดยื่นได้แล้วนะ!)` : `(นับถอยหลังอีก ${d} วัน)`;

      return `สวัสดีจ้า ${callName}! 😊🌸\nเราช่วยคำนวณวันครบกำหนดส่งวิทยฐานะ (${rank} - เกณฑ์ ${yrs} ปี) ลงในสมุดที่ปรึกษาไว้ให้แล้วนะจ๊ะ:\n\n🌱 วันที่เริ่ม ค.ศ.1 (ครู): ${ks1Date ? formatThaiDate(ks1Date) : '-'}\n📘 วันที่เริ่ม/ครบยื่น ค.ศ.2 (ชำนาญการ): ${calcKs2 ? formatThaiDate(calcKs2) : '-'}\n👑 วันที่ครบยื่น ค.ศ.3 (ชำนาญการพิเศษ): ${calcKs3 ? formatThaiDate(calcKs3) : '-'}\n-------------------------\n🎬 ช่วงที่แนะนำให้เริ่มเตรียมแผน & อัดคลิป 60 นาที (ล่วงหน้า 3 เดือน):\n👉 ตั้งแต่วันที่ ${prepDate ? formatThaiDate(prepDate) : '-'}\n\n🚀 วันที่ควรส่งงานในระบบ DPA (${rank}):\n👉 ส่งได้ตั้งแต่วันที่ ${targetDate ? formatThaiDate(targetDate) : '-'} เป็นต้นไปจ้า! ${countdownTxt}\n-------------------------\nเตรียมแผนหรืออัดคลิปเมื่อไหร่ ส่งมาให้เราช่วยสแกน 6 จุดตาย DPA ก่อนยื่นได้เลยน้า สู้ๆ จ้า! ✌🏻✨🟢`;
    }

    function copyModalCalcAdvice() {
      const nameStr = document.getElementById('f-name').value || 'ตัวเอง';
      const rank = document.getElementById('f-rank').value || 'ค.ศ.2';
      const ks1Date = document.getElementById('f-ks1-date').value;

      const reqYears = document.getElementById('f-req-years').value || '4';

        .catch(() => showToast('📋 คัดลอกผลคำนวณวันส่งเรียบร้อยจ้า!'));

    function saveFriendForm(e) {
      e.preventDefault();
      const id = document.getElementById('f-id').value || `friend_${Date.now()}`;
      const existing = friends.find(x => x.id === id);
      const checklist = [];
      if (document.getElementById('c-plan').checked) checklist.push('แผนการสอน');
      if (document.getElementById('c-video').checked) checklist.push('คลิปการสอน');
      if (document.getElementById('c-outcome').checked) checklist.push('ผลลัพธ์ผู้เรียน');
      if (document.getElementById('c-pa').checked) checklist.push('ระบบ PA/DPA');

      const item = {
        id,
        name: document.getElementById('f-name').value.trim(),
        colorSeed: pendingColorSeed,
        school: document.getElementById('f-school').value.trim(),
        rank: document.getElementById('f-rank').value,
        ks1Date: document.getElementById('f-ks1-date').value,
        ks2Date: document.getElementById('f-ks2-date').value,
        reqYears: parseInt(document.getElementById('f-req-years').value, 10) === 3 ? 3 : 4,
        targetDate: document.getElementById('f-date').value,
        contact: document.getElementById('f-contact').value.trim(),
        status: document.getElementById('f-status').value,
        subject: document.getElementById('f-subject').value.trim(),
        grade: document.getElementById('f-grade').value.trim(),
        topic: document.getElementById('f-topic').value.trim(),
        innovation: document.getElementById('f-innovation').value.trim(),
        links: {
          drive: document.getElementById('f-link-drive').value.trim(),
          plan: document.getElementById('f-link-plan').value.trim(),
          video: document.getElementById('f-link-video').value.trim()
        },
        files: existing && Array.isArray(existing.files) ? existing.files : [],
        pitfalls: existing && Array.isArray(existing.pitfalls) ? existing.pitfalls : [],
        timeline: existing && Array.isArray(existing.timeline) ? existing.timeline : [
          { date: nowThaiStamp(), text: '🌸 เริ่มสร้างสมุดที่ปรึกษาให้เพื่อน' }

        checklist,
        notes: document.getElementById('f-notes').value.trim()
      };

      const th = getFriendTheme(item);
      saveData(`${th.emoji} บันทึก "${shortName(item.name)}" พร้อมคำนวณวันส่ง DPA เรียบร้อยจ้า!`);

    function updateMsgPreview() {
      const f = friends.find(x => x.id === activeMsgFriendId);
      if (!f) return;
      const d = getDaysUntil(f.targetDate);
      const tDate = formatThaiDate(f.targetDate);
      const rankTxt = f.rank === 'ค.ศ.3' ? 'ค.ศ.3 (ชำนาญการพิเศษ)' : 'ค.ศ.2 (ชำนาญการ)';
      const chk = Array.isArray(f.checklist) ? f.checklist : [];
      const pitfalls = Array.isArray(f.pitfalls) ? f.pitfalls : [];
      const ct = getFriendCareerTimeline(f);

      let text = '';
      if (currentMsgMode === 1) {
        text = buildTimelineAdviceText(f.name, f.rank, ct.ks1Date, ct.calcKs2Date, ct.reqYears, f.targetDate);
      } else if (currentMsgMode === 2) {
        const timeTxt = d < 0
          ? `เห็นว่าครบกำหนดยื่น ${rankTxt} ตั้งแต่วันที่ ${tDate} แล้วนะ!`
          : `จากที่คำนวณอายุงานไว้ จะครบกำหนดส่ง ${rankTxt} ได้ตั้งแต่วันที่ ${tDate} (อีก ${d} วัน) นี้แล้ว!`;
        text = `สวัสดีครับ ${f.name}! 😊🌸\n${timeTxt}\n(แนะนำให้เริ่มเตรียมแผนและอัดคลิปช่วงวันที่ ${ct.prepStartDate ? formatThaiDate(ct.prepStartDate) : '-'} นะครับ)\n\nเลยแวะมาทักถามความคืบหน้าหน่อยครับ จะได้ช่วยกันวางแผนถูก:\n1️⃣ เล็งไว้หรือยังว่าจะทำเรื่องอะไร / หน่วยการเรียนรู้ไหน?\n2️⃣ เลือกอัดคลิปสอนนักเรียนระดับชั้นไหน?\n3️⃣ กะว่าจะใช้นวัตกรรม สื่อ หรือวิธีการสอนแบบไหนเป็นตัวชูโรง? (เช่น Active Learning, GPAS 5 Steps, PBL, บอร์ดเกม ฯลฯ)\n\nว่างแล้วพิมพ์บอกไว้ได้เลยนะ เดี๋ยวจดไว้ในสมุดที่ปรึกษาให้ครับ! ✌🏻✨🟢`;
      } else if (currentMsgMode === 3) {
        const missingDocs = CHECKLIST_OPTS.filter(c => !chk.includes(c.key)).map(c => c.label).join(', ');
        text = `สวัสดีครับ ${f.name}! 😊✨\nแวะมาอัปเดตความคืบหน้าเรื่องทำ ${rankTxt} ${f.topic ? `เรื่อง "${f.topic}"` : ''} ${f.grade ? `(ชั้น ${f.grade})` : ''} (กำหนดส่ง DPA ได้ตั้งแต่วันที่ ${tDate}) ครับ!\n\nตอนนี้รายการที่กำลังลุยต่อคือ: ${missingDocs || 'เตรียมความพร้อมขั้นสุดท้าย'}\nถ้าทำไฟล์แผนการสอนหรืออัดคลิปเสร็จแล้ว ส่งลิงก์ Google Drive หรือส่งไฟล์มาให้ช่วยสแกนดูได้เลยนะครับ สู้ๆ ครับ! ✌🏻🌸`;
      } else if (currentMsgMode === 4) {
        const uncheckedPitfalls = DPA_PITFALLS.filter(p => !pitfalls.includes(p.key)).map(p => `• ${p.label}`).join('\n');
        text = `สวัสดีครับ ${f.name}! 🔍✨\nผมช่วยเช็กงานสำหรับยื่น ${rankTxt} ให้เบื้องต้นแล้วนะครับ (${pitfalls.length}/6 จุดสำคัญ)\n\n${uncheckedPitfalls ? `จุดที่อยากให้ลองเช็กเพิ่มอีกนิดก่อนยื่นครับ:\n${uncheckedPitfalls}` : '🎉 เช็กครบทั้ง 6 จุดสำคัญของ DPA แล้ว ผ่านฉลุยเลยครับ!'}\n\n${f.notes ? `หมายเหตุเพิ่มเติม: ${f.notes}\n` : ''}ปรับเสร็จแล้วส่งมาให้ดูอีกรอบได้ตลอดเลยนะครับ! ✌🏻🟢`;
      } else {
        text = `สวัสดีครับ ${f.name}! 🎉🍀\nขอส่งกำลังใจให้สำหรับการยื่นขอ ${rankTxt} ในระบบ DPA (ส่งได้ตั้งแต่วันที่ ${tDate}) นะครับ! เตรียมงานมาตั้งใจขนาดนี้ ขอให้กรรมการอ่านแผนดูคลิปแล้วประทับใจ ได้ขึ้น "ป้ายเขียวอนุมัติ" ไวๆ เลยนะครับ ลุ้นไปด้วยกันครับ! 🟢✨🎉✌🏻`;
      }

      document.getElementById('msg-box').textContent = text;
    }

    function closeMsgModal() {
      document.getElementById('msg-modal').classList.remove('open');
    }

    function editFromMsgModal() {
      closeMsgModal();
      if (activeMsgFriendId) openFriendModal(activeMsgFriendId);
    }

    function copyChatMsg() {
      const txt = document.getElementById('msg-box').textContent;
      navigator.clipboard.writeText(txt).then(() => showToast('📋 คัดลอกข้อความส่งแชทเรียบร้อยแล้ว!')).catch(() => showToast('คัดลอกแล้ว!'));
    }

    function esc(s) {
      if (!s) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    loadData();
  </script>
</body>
</html>
