<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="คิวเพื่อน ค.ศ.2-3" />
  <meta name="theme-color" content="#FFF5F8" />
  <title>🌸 สมุดจำคิวเพื่อนครู ค.ศ.2 & ค.ศ.3 | ครูเกียรติศักดิ์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #FFF7FA;
      --bg-card: #FFFFFF;
      --text-main: #3B2C35;
      --text-sub: #7A6571;

      --pink-primary: #EC4899;
      --pink-light: #FCE7F3;
      --pink-border: #F9A8D4;

      --sky-primary: #0284C7;
      --sky-light: #E0F2FE;
      --sky-border: #7DD3FC;

      --orange-primary: #EA580C;
      --orange-light: #FFEDD5;
      --orange-border: #FDBA74;

      --amber-primary: #D97706;
      --amber-light: #FEF3C7;
      --amber-border: #FCD34D;

      --mint-primary: #059669;
      --mint-light: #D1FAE5;
      --mint-border: #6EE7B7;

      --lavender-light: #F3E8FF;
      --lavender-border: #D8B4FE;
      --lavender-text: #6B21A8;
    }

    /* บังคับใช้ฟอนต์ Itim (ไอติม) ทั้งเว็บไซต์ 100% ทุกตัวอักษรและทุกปุ่ม */
    *, *::before, *::after,
    body, h1, h2, h3, h4, p, span, div, a,
    button, input, select, textarea, label, summary, details {
      font-family: 'Itim', -apple-system, BlinkMacSystemFont, sans-serif !important;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      background-image:
        radial-gradient(#FBCFE8 1.2px, transparent 1.2px),
        radial-gradient(#BAE6FD 1.2px, #FFF7FA 1.2px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: var(--text-main);
      line-height: 1.5;
      padding: 10px 10px 85px 10px;
      min-height: 100vh;
    }

    .app-shell {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 1. Compact Cute Top Header */
    .top-bar {
      background: linear-gradient(135deg, #FCE7F3 0%, #FEF3C7 55%, #D1FAE5 100%);
      border: 2.5px solid var(--pink-border);
      border-radius: 22px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 4px 0 rgba(244, 114, 182, 0.18);
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .avatar-badge {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #EC4899, #F43F5E);
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 6px rgba(236, 72, 153, 0.25);
    }

    .brand-title {
      font-size: 16.5px;
      color: var(--text-main);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-sub {
      font-size: 12px;
      color: #BE185D;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    /* Cute Bouncy Buttons */
    .btn {
      font-size: 14px;
      padding: 7px 13px;
      border-radius: 999px;
      border: 2px solid #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 0.1s ease;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12);
    }

    .btn-pink {
      background: linear-gradient(135deg, #EC4899, #F43F5E);
      color: #FFFFFF;
      box-shadow: 0 3px 0 #BE185D;
    }

    .btn-mint {
      background: var(--mint-light);
      color: #065F46;
      border-color: var(--mint-border);
      box-shadow: 0 3px 0 #6EE7B7;
    }

    .btn-amber {
      background: var(--amber-light);
      color: #92400E;
      border-color: var(--amber-border);
      box-shadow: 0 3px 0 #FCD34D;
    }

    .btn-sky {
      background: var(--sky-light);
      color: #0369A1;
      border-color: var(--sky-border);
      box-shadow: 0 3px 0 #7DD3FC;
    }

    .btn-lavender {
      background: var(--lavender-light);
      color: var(--lavender-text);
      border-color: var(--lavender-border);
      box-shadow: 0 3px 0 #D8B4FE;
    }

    .btn-sm {
      font-size: 13px;
      padding: 5px 10px;
    }

    /* 2. GoodNotes-Style Folder Tabs Bar */
    .tabs-wrapper {
      background: #FFFFFF;
      border: 2.5px solid var(--pink-border);
      border-radius: 22px;
      padding: 8px;
      box-shadow: 0 4px 0 rgba(249, 168, 212, 0.22);
      position: sticky;
      top: 6px;
      z-index: 30;
    }

    .tabs-label {
      font-size: 12px;
      color: var(--text-sub);
      padding: 0 6px 4px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tabs-scroll {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 3px;
      scrollbar-width: none;
    }

    .tabs-scroll::-webkit-scrollbar {
      display: none;
    }

    .tab-chip {
      padding: 6px 13px;
      border-radius: 999px;
      border: 2px solid #FBCFE8;
      background: #FFF5F8;
      color: var(--text-main);
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .tab-chip.tab-ks2 {
      border-color: var(--sky-border);
      background: #F0F9FF;
    }

    .tab-chip.tab-ks3 {
      border-color: var(--orange-border);
      background: #FFF7ED;
    }

    .tab-chip.active {
      background: linear-gradient(135deg, #EC4899, #F43F5E);
      color: #FFFFFF;
      border-color: #FFFFFF;
      box-shadow: 0 3px 8px rgba(236, 72, 153, 0.35);
      transform: translateY(-1px);
    }

    .tab-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F59E0B;
      display: inline-block;
    }

    .tab-chip.active .tab-dot {
      background: #FEF08A;
    }

    /* 3. Overview Tab Content */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .mini-stat {
      background: #FFFFFF;
      border: 2px solid var(--pink-border);
      border-radius: 18px;
      padding: 8px 5px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0,0,0,0.04);
    }

    .mini-stat.active {
      outline: 2.5px solid #EC4899;
      background: #FFF0F6;
    }

    .mini-stat-label {
      font-size: 12px;
      color: var(--text-sub);
      display: block;
    }

    .mini-stat-num {
      font-size: 18px;
      color: var(--text-main);
    }

    /* Urgent Radar Card */
    .radar-card {
      background: #FFFBEB;
      border: 2.5px solid var(--amber-border);
      border-radius: 22px;
      padding: 12px 14px;
      box-shadow: 0 4px 0 rgba(251, 191, 36, 0.2);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .radar-row {
      background: #FFFFFF;
      border: 2px solid var(--amber-border);
      border-radius: 16px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Directory Card */
    .directory-card {
      background: #FFFFFF;
      border: 2.5px solid var(--lavender-border);
      border-radius: 22px;
      padding: 12px;
      box-shadow: 0 4px 0 rgba(216, 180, 254, 0.25);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-cute {
      width: 100%;
      padding: 8px 12px;
      border-radius: 14px;
      border: 2px solid var(--pink-border);
      background: #FFFDF9;
      font-size: 14.5px;
      color: var(--text-main);
    }

    .input-cute:focus {
      outline: none;
      border-color: var(--pink-primary);
      background: #FFFFFF;
    }

    .friend-row-item {
      background: #FFFDF9;
      border: 2px solid #F3E8FF;
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
    }

    .friend-row-item:active {
      border-color: var(--pink-border);
      background: #FFF5F8;
    }

    /* 4. Single Friend Personal Page */
    .person-page {
      background: #FFFFFF;
      border: 3px solid var(--pink-border);
      border-radius: 26px;
      padding: 15px;
      box-shadow: 0 7px 0 rgba(249, 168, 212, 0.28);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .person-page.theme-ks2 {
      border-color: var(--sky-border);
      box-shadow: 0 7px 0 rgba(125, 211, 252, 0.28);
    }

    .person-page.theme-ks3 {
      border-color: var(--orange-border);
      box-shadow: 0 7px 0 rgba(253, 186, 116, 0.28);
    }

    .person-nav-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-bottom: 8px;
      border-bottom: 2px dashed #FBCFE8;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 13px;
    }

    .pill-ks2 {
      background: var(--sky-light);
      color: #0369A1;
      border: 1.5px solid var(--sky-border);
    }

    .pill-ks3 {
      background: var(--orange-light);
      color: #C2410C;
      border: 1.5px solid var(--orange-border);
    }

    .pill-status {
      background: var(--pink-light);
      color: #BE185D;
      border: 1.5px solid var(--pink-border);
    }

    .countdown-banner {
      padding: 10px 13px;
      border-radius: 18px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      border: 2px solid var(--sky-border);
      background: var(--sky-light);
      color: #0369A1;
    }

    .countdown-banner.urgent {
      background: var(--pink-light);
      border-color: var(--pink-border);
      color: #BE185D;
    }

    .countdown-banner.soon {
      background: var(--amber-light);
      border-color: var(--amber-border);
      color: #92400E;
    }

    .countdown-banner.ready {
      background: var(--mint-light);
      border-color: var(--mint-border);
      color: #065F46;
    }

    /* GoodNotes Notebook Box */
    .notebook-box {
      background: #FFFBEB;
      border: 2px dashed var(--amber-border);
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 14.5px;
    }

    .notebook-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding-bottom: 5px;
      border-bottom: 1px dashed #FDE68A;
    }

    .notebook-line:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .notebook-key {
      color: #92400E;
      min-width: 115px;
      flex-shrink: 0;
    }

    /* Links & Attached Files Section */
    .files-box {
      background: #F0F9FF;
      border: 2px solid var(--sky-border);
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .link-pills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    @media (max-width: 460px) {
      .link-pills-grid {
        grid-template-columns: 1fr;
      }
    }

    .link-slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #FFFFFF;
      border: 1.5px solid var(--sky-border);
      border-radius: 13px;
      padding: 7px 10px;
      font-size: 13px;
    }

    .attached-file-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #FFFFFF;
      border: 1.5px dashed var(--sky-primary);
      border-radius: 13px;
      padding: 7px 10px;
      font-size: 13px;
    }

    /* Collapsible DPA 6 Pitfalls Box */
    details.pitfalls-box {
      background: #FFF1F2;
      border: 2px solid #FDA4AF;
      border-radius: 20px;
      padding: 10px 13px;
    }

    details.pitfalls-box summary {
      font-size: 14.5px;
      color: #BE123C;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    details.pitfalls-box summary::-webkit-details-marker {
      display: none;
    }

    .pitfalls-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pitfall-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: #FFFFFF;
      border: 1.5px solid #FECDD3;
      border-radius: 13px;
      padding: 8px 10px;
      font-size: 13.5px;
      cursor: pointer;
    }

    .pitfall-item.checked {
      background: var(--mint-light);
      border-color: var(--mint-border);
      color: #065F46;
    }

    .pitfall-item input {
      accent-color: #059669;
      margin-top: 3px;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Zero-Typing 1-Tap Timeline & Voice Note Box */
    .timeline-box {
      background: #FAF5FF;
      border: 2px solid var(--lavender-border);
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .stamp-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .stamp-btn {
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 99px;
      border: 1.5px solid var(--lavender-border);
      background: #FFFFFF;
      color: var(--lavender-text);
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(216, 180, 254, 0.4);
      transition: transform 0.1s ease;
    }

    .stamp-btn:active {
      transform: translateY(2px);
      background: var(--lavender-light);
    }

    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 210px;
      overflow-y: auto;
    }

    .timeline-entry {
      background: #FFFFFF;
      border-left: 4px solid #A855F7;
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .progress-track {
      width: 100%;
      height: 11px;
      background: #FCE7F3;
      border-radius: 99px;
      overflow: hidden;
      margin: 5px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #F472B6, #FBBF24, #34D399);
      border-radius: 99px;
      transition: width 0.25s ease;
    }

    .chk-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    .chk-card {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border-radius: 14px;
      border: 2px solid #E5E7EB;
      background: #FAFAFA;
      font-size: 13.5px;
      cursor: pointer;
    }

    .chk-card.done {
      border-color: var(--mint-border);
      background: var(--mint-light);
      color: #065F46;
    }

    .chk-card input {
      accent-color: #EC4899;
      width: 16px;
      height: 16px;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(59, 44, 53, 0.55);
      backdrop-filter: blur(3px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-y: auto;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #FFFFFF;
      border: 3px solid var(--pink-border);
      border-radius: 26px;
      width: 100%;
      max-width: 520px;
      max-height: 91vh;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .col-full {
      grid-column: 1 / -1;
    }

    @media (max-width: 480px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-label {
      display: block;
      font-size: 13.5px;
      color: #BE185D;
      margin-bottom: 3px;
    }

    .tag-btn {
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 99px;
      border: 1.5px solid var(--pink-border);
      background: var(--pink-light);
      color: #BE185D;
      cursor: pointer;
    }

    .msg-mode-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .msg-mode-btn {
      padding: 7px 10px;
      border-radius: 12px;
      border: 2px solid var(--amber-border);
      background: #FFFBEB;
      color: #92400E;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }

    .msg-mode-btn.active {
      background: #F59E0B;
      color: #FFFFFF;
      border-color: #D97706;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 18px;
      right: 18px;
      max-width: 340px;
      margin: 0 auto;
      background: #EC4899;
      color: #FFFFFF;
      border: 2px solid #FFFFFF;
      padding: 10px 16px;
      border-radius: 99px;
      font-size: 14.5px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(236, 72, 153, 0.4);
      z-index: 200;
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">

    <!-- 1. Compact Header -->
    <header class="top-bar">
      <div class="brand-left">
        <div class="avatar-badge">
          <span style="font-size:18px;line-height:1;">🧑🏻‍🏫</span>
          <span style="font-size:10px;line-height:1;">ค.ศ.3</span>
        </div>
        <div style="min-width:0;">
          <h1 class="brand-title">🌸 สมุดจำคิวเพื่อนทำ ค.ศ.2-3</h1>
          <div class="brand-sub">ครูเกียรติศักดิ์ กรุณา (9,999 กิจกรรม) ✨</div>
        </div>
      </div>

      <div class="top-actions">
        <a href="https://docs.google.com/spreadsheets/d/1JW35O0ZLsJ0lxno5jOxTR3A34vGCv4ljdsfo_CylVys/edit" target="_blank" rel="noopener" class="btn btn-mint btn-sm" title="เปิดตาราง Google Sheets">
          📗 ชีต
        </a>
        <button type="button" class="btn btn-pink btn-sm" onclick="openFriendModal()">
          ➕ เพิ่มเพื่อน
        </button>
      </div>
    </header>

    <!-- 2. Sticky Notebook Folder Tabs -->
    <nav class="tabs-wrapper" aria-label="แถบสลับหน้า">
      <div class="tabs-label">
        <span>🗂️ แตะสลับแท็บแดชบอร์ด หรือชื่อเพื่อนเพื่อดูรายคน:</span>
        <span id="tab-counter">0 คน</span>
      </div>
      <div id="tabs-bar" class="tabs-scroll"></div>
    </nav>

    <!-- 3. Dynamic Main Content -->
    <main id="main-view"></main>

  </div>

  <!-- Hidden File Input for Attaching Friend Files (PDF / Word / Images) -->
  <input type="file" id="hidden-file-picker" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,image/*" style="display:none;" onchange="handleFileSelected(event)" />

  <!-- Add / Edit Friend Modal -->
  <div id="friend-modal" class="modal-overlay">

    // IndexedDB for storing attached files (PDF, Word, Images) on mobile without 5MB localStorage limit
    let dbPromise = null;
    function getDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open('KruKiattisakDPADocsDB', 1);
          req.onupgradeneeded = e => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('files')) {
              db.createObjectStore('files', { keyPath: 'fileId' });
            }
          };
          req.onsuccess = e => resolve(e.target.result);
          req.onerror = e => reject(e);
        });
      }
      return dbPromise;
    }

    async function saveBlobToDB(fileId, fileName, mimeType, dataUrl) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readwrite');
        tx.objectStore('files').put({ fileId, fileName, mimeType, dataUrl });
        tx.oncomplete = () => resolve();
        tx.onerror = e => reject(e);
      });
    }

    async function getBlobFromDB(fileId) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readonly');
        const req = tx.objectStore('files').get(fileId);
        req.onsuccess = () => resolve(req.result);
        req.onerror = e => reject(e);
      });
    }

    function formatThaiDate(dateStr) {
      if (!dateStr) return '-';
      const p = dateStr.split('-');
      if (p.length !== 3) return dateStr;
      return `${parseInt(p[2], 10)} ${THAI_MONTHS[parseInt(p[1], 10) - 1] || ''} ${parseInt(p[0], 10) + 543}`;
    }

    function nowThaiStamp() {

      const p = dateStr.split('-');
      if (p.length !== 3) return 9999;
      const targetUTC = Date.UTC(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
      return Math.round((targetUTC - todayUTC) / 86400000);
    }

    function needsConsult(f) {
      if (f.status === 'ยื่น DPA แล้ว' || f.status === 'ผ่านแล้ว 🎉') return false;
      const days = getDaysUntil(f.targetDate);
      const missing = !f.topic?.trim() || !f.grade?.trim() || !f.innovation?.trim();
      return (days <= 90 && missing) || f.status === 'ถึงเวลาทักถามข้อมูล';
    }

    function getCountdownBadge(f) {
      if (f.status === 'ผ่านแล้ว 🎉') return { text: '🟢 อนุมัติผ่านแล้ว (ป้ายเขียว!)', cls: 'ready' };
      if (f.status === 'ยื่น DPA แล้ว') return { text: '🚀 ยื่น DPA แล้ว รอลุ้นป้ายเขียว!', cls: 'ready' };
      const d = getDaysUntil(f.targetDate);
      if (d < 0) return { text: `🍓 ยื่นได้แล้วน้า! (ผ่านมา ${Math.abs(d)} วัน)`, cls: 'urgent' };
      if (d === 0) return { text: '🎉 ครบกำหนดยื่นวันนี้วันแรก!', cls: 'urgent' };
      if (d <= 30) return { text: `⏰ อีก ${d} วันจะยื่นได้!`, cls: 'urgent' };
      if (d <= 90) return { text: `🍋 อีก ${d} วันครบกำหนด`, cls: 'soon' };
      return { text: `🌱 อีก ${d} วัน (${Math.round(d / 30)} เดือน)`, cls: '' };
    }

    function shortName(fullName) {
      if (!fullName) return 'เพื่อนครู';
      return fullName.split('(')[0].trim();
    }

    function selectTab(tabId) {
      activeTab = tabId;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setOverviewFilter(mode) {
      overviewFilter = mode;
      renderApp();
    }

    function clearSampleFriends() {
      if (!confirm('🧹 ต้องการล้างรายชื่อตัวอย่างทั้ง 4 คนออก เพื่อเริ่มใส่รายชื่อเพื่อนจริงของคุณครูใช่ไหมครับ?')) return;
      friends = friends.filter(f => !f.isSample && !['friend_1','friend_2','friend_3','friend_4'].includes(f.id));
      activeTab = 'overview';
      saveData('🧹 ล้างข้อมูลตัวอย่างออกเรียบร้อย! กด + เพิ่มเพื่อนจริงได้เลยจ้า');
    }

    function renderTabsBar() {
      const bar = document.getElementById('tabs-bar');
      document.getElementById('tab-counter').textContent = `ทั้งหมด ${friends.length} คน`;

      const sorted = [...friends].sort((a, b) => getDaysUntil(a.targetDate) - getDaysUntil(b.targetDate));

      let html = `
        <button type="button" class="tab-chip ${activeTab === 'overview' ? 'active' : ''}" onclick="selectTab('overview')">
          <span>📊 แดชบอร์ดรวม</span>
        </button>
      `;

      html += sorted.map(f => {
        const isActive = activeTab === f.id;
        const urgent = needsConsult(f);
        const rankIcon = f.rank === 'ค.ศ.3' ? '👑' : '📘';
        const rankCls = f.rank === 'ค.ศ.3' ? 'tab-ks3' : 'tab-ks2';
        return `
          <button type="button" class="tab-chip ${rankCls} ${isActive ? 'active' : ''}" onclick="selectTab('${f.id}')">
            <span>${rankIcon} ${esc(shortName(f.name))}</span>
            ${urgent ? '<span class="tab-dot" title="ใกล้ครบกำหนด/รอทักถาม"></span>' : ''}
          </button>
        `;
      }).join('');

      html += `
        <button type="button" class="tab-chip" style="border-style:dashed;" onclick="openFriendModal()">
          <span>➕ เพิ่มคนใหม่</span>
        </button>
      `;

      bar.innerHTML = html;
    }

      const consultList = friends.filter(needsConsult).sort((a, b) => getDaysUntil(a.targetDate) - getDaysUntil(b.targetDate));

      const ks3Count = friends.filter(f => f.rank === 'ค.ศ.3').length;

          if (searchQuery) {

            </div>
            ${consultList.map(f => {
              const d = getDaysUntil(f.targetDate);
              const dayTxt = d < 0 ? `ครบแล้ว (${formatThaiDate(f.targetDate)})` : `อีก ${d} วัน (${formatThaiDate(f.targetDate)})`;
              return `
                <div class="radar-row">
                  <div onclick="selectTab('${f.id}')" style="cursor:pointer;flex:1;min-width:155px;">
                    <div style="font-size:15.5px;color:var(--text-main);">
                      <strong>${esc(f.name)}</strong>
                      <span class="pill ${f.rank === 'ค.ศ.3' ? 'pill-ks3' : 'pill-ks2'}" style="padding:1px 8px;font-size:12px;">${esc(f.rank)}</span>
                    </div>
                    <div style="font-size:13px;color:#B45309;">📅 ${dayTxt} &bull; 🌷 แตะเพื่อเปิดหน้าของเพื่อน</div>

              <span class="mini-stat-label" style="color:#C2410C;">👑 ค.ศ.3</span>
              <div class="mini-stat-num" style="color:#EA580C;">${ks3Count} คน</div>

          ${radarHtml}

          <!-- Compact Friend Directory -->
          <section class="directory-card">

              <h2 style="font-size:15.5px;color:var(--lavender-text);">📋 รายชื่อเพื่อนทั้งหมด (แตะชื่อเพื่อเปิดดูรายคน)</h2>
              ${hasSample ? `
                <button type="button" class="btn btn-lavender btn-sm" onclick="clearSampleFriends()">
                  🧹 ล้างข้อมูลตัวอย่าง 4 คนออก
                </button>
              ` : ''}
            </div>

            <div>
              <input
                type="search"
                class="input-cute"
                placeholder="🔍 ค้นหาชื่อเพื่อน, โรงเรียน, วิชา, เรื่องที่จะทำ..."
                value="${esc(searchQuery)}"
                oninput="searchQuery = this.value; renderApp();"

            </div>

            <div style="display:flex;flex-direction:column;gap:7px;">
              ${filtered.length === 0 ? `

            </div>
          </section>
        </div>

          <div class="timeline-box">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
              <span style="font-size:15px;color:var(--lavender-text);">⚡ จิ้มบันทึกไทม์ไลน์ใน 1 คลิก (ไม่ต้องพิมพ์เอง!)</span>
              <button type="button" class="btn btn-pink btn-sm" onclick="startVoiceLog('${f.id}')" title="พูดด้วยเสียงเพื่อจดลงไทม์ไลน์">
                🎙️ พูดเพื่อจดบันทึก
              </button>
            </div>
            <div style="font-size:12.5px;color:var(--text-sub);">
              แตะปุ่มด้านล่างปุ๊บ ระบบจะลงวันที่วันนี้ในไทม์ไลน์และอัปเดตสถานะของเพื่อนให้อัตโนมัติทันที:
            </div>
            <div class="stamp-grid">
              ${QUICK_STAMPS.map((st, sIdx) => `
                <button type="button" class="stamp-btn" onclick="applyQuickStamp('${f.id}', ${sIdx})">
                  + ${esc(st.label)}
                </button>
              `).join('')}
            </div>

            <!-- Custom 1-line note or timeline history -->
            <div style="display:flex;gap:6px;margin-top:2px;">
              <input type="text" id="quick-note-input-${f.id}" class="input-cute" style="padding:6px 10px;font-size:13.5px;" placeholder="หรือพิมพ์สั้นๆ แล้วกด +บันทึก..." />
              <button type="button" class="btn btn-lavender btn-sm" onclick="addCustomTimeline('${f.id}')">+ บันทึก</button>
            </div>

            <div class="timeline-list">
              ${timeline.length === 0 ? `
                <div style="font-size:13px;color:var(--text-sub);text-align:center;padding:8px;">ยังไม่มีประวัติไทม์ไลน์ แตะปุ่มสแตมป์ด้านบนได้เลยจ้า</div>
              ` : timeline.map((t, tIdx) => `
                <div class="timeline-entry">
                  <div>
                    <span style="font-size:12px;color:#7C3AED;background:#F3E8FF;padding:1px 7px;border-radius:99px;margin-right:5px;">${esc(t.date)}</span>
                    <span>${esc(t.text)}</span>
                  </div>
                  <button type="button" style="background:none;border:none;color:#9CA3AF;cursor:pointer;font-size:13px;" onclick="removeTimelineEntry('${f.id}', ${tIdx})">✕</button>
                </div>
              `).join('')}
            </div>
          </div>
        </article>
      `;
    }

    function renderApp() {
      renderTabsBar();
      const mainEl = document.getElementById('main-view');
      if (activeTab === 'overview') {
        mainEl.innerHTML = renderOverview();
      } else {
        mainEl.innerHTML = renderSingleFriendPage(activeTab);
      }
    }

    // 1-Tap Quick Stamp Handler (Zero Typing!)
    function applyQuickStamp(friendId, stampIdx) {
      const f = friends.find(x => x.id === friendId);
      const st = QUICK_STAMPS[stampIdx];
      if (!f || !st) return;

      if (!Array.isArray(f.timeline)) f.timeline = [];
      f.timeline.unshift({
        date: nowThaiStamp(),
        text: st.label
      });

      if (st.status) {
        f.status = st.status;
      }
      if (st.check) {
        const set = new Set(Array.isArray(f.checklist) ? f.checklist : []);
        set.add(st.check);
        f.checklist = Array.from(set);
      }
      saveData(`⚡ บันทึก "${st.label}" ลงไทม์ไลน์แล้วจ้า!`);
    }

    function addCustomTimeline(friendId) {
      const f = friends.find(x => x.id === friendId);
      const input = document.getElementById(`quick-note-input-${friendId}`);
      if (!f || !input || !input.value.trim()) return;
      if (!Array.isArray(f.timeline)) f.timeline = [];
      f.timeline.unshift({
        date: nowThaiStamp(),
        text: input.value.trim()
      });
      input.value = '';
      saveData('📝 เพิ่มบันทึกไทม์ไลน์แล้ว!');
    }

    function removeTimelineEntry(friendId, idx) {
      const f = friends.find(x => x.id === friendId);
      if (!f || !Array.isArray(f.timeline)) return;
      f.timeline.splice(idx, 1);
      saveData('ลบรายการไทม์ไลน์แล้ว');
    }

    // Voice-to-Text (Speech Recognition in Thai)
    function startVoiceLog(friendId) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        const txt = prompt('🎙️ พิมพ์หรือกดปุ่มไมโครโฟนบนคีย์บอร์ดมือถือเพื่อพูดบันทึกได้เลยครับ:');
        if (txt && txt.trim()) {
          const f = friends.find(x => x.id === friendId);
          if (f) {
            if (!Array.isArray(f.timeline)) f.timeline = [];
            f.timeline.unshift({ date: nowThaiStamp(), text: `🎙️ ${txt.trim()}` });
            saveData('🎙️ บันทึกเข้าไทม์ไลน์แล้ว!');
          }
        }
        return;
      }
      const rec = new SpeechRec();
      rec.lang = 'th-TH';
      rec.interimResults = false;
      showToast('🎙️ กำลังฟัง... พูดสิ่งที่คุยกับเพื่อนได้เลยครับ!');
      rec.onresult = e => {
        const transcript = e.results[0][0].transcript;
        const f = friends.find(x => x.id === friendId);
        if (f && transcript) {
          if (!Array.isArray(f.timeline)) f.timeline = [];
          f.timeline.unshift({ date: nowThaiStamp(), text: `🎙️ ${transcript}` });
          saveData(`🎙️ บันทึกเสียง: "${transcript}" เรียบร้อย!`);
        }
      };
      rec.onerror = () => {
        showToast('สามารถกดรูปไมโครโฟนบนคีย์บอร์ดมือถือแทนได้นะครับ');
      };
      rec.start();
    }

    // Quick Link Prompt
    function quickPromptLink(friendId, linkType, title) {
      const f = friends.find(x => x.id === friendId);
      if (!f) return;
      if (!f.links) f.links = { drive: '', plan: '', video: '' };
      const url = prompt(`🔗 วาง ${title} ของ ${shortName(f.name)}:`, f.links[linkType] || '');
      if (url === null) return;
      f.links[linkType] = url.trim();
      saveData('🔗 บันทึกลิงก์งานของเพื่อนเรียบร้อยแล้ว!');
    }

    // Direct File Attachment (PDF / Word / Images)
    function triggerFileUpload(friendId) {
      pendingFileFriendId = friendId;
      const picker = document.getElementById('hidden-file-picker');
      picker.value = '';
      picker.click();
    }

    function handleFileSelected(e) {
      const files = Array.from(e.target.files || []);
      if (!files.length || !pendingFileFriendId) return;
      const f = friends.find(x => x.id === pendingFileFriendId);
      if (!f) return;
      if (!Array.isArray(f.files)) f.files = [];

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = async ev => {
          const fileId = `file_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
          const sizeKB = Math.round(file.size / 1024);
          const sizeLabel = sizeKB > 1024 ? `${(sizeKB / 1024).toFixed(1)} MB` : `${sizeKB} KB`;
          try {
            await saveBlobToDB(fileId, file.name, file.type, ev.target.result);
            f.files.push({ fileId, name: file.name, sizeLabel });
            if (!Array.isArray(f.timeline)) f.timeline = [];
            f.timeline.unshift({ date: nowThaiStamp(), text: `📎 แนบไฟล์: ${file.name}` });
            saveData(`📎 แนบไฟล์ "${file.name}" เรียบร้อยแล้วจ้า!`);
          } catch (err) {
            showToast('แนบไฟล์ไม่สำเร็จ ลองใช้ลิงก์ Google Drive แทนนะครับ');
          }
        };
        reader.readAsDataURL(file);
      });
    }

    async function openAttachedFile(fileId) {
      try {
        const rec = await getBlobFromDB(fileId);
        if (!rec || !rec.dataUrl) {
          showToast('ไม่พบข้อมูลไฟล์ในเครื่องนี้');
          return;
        }
        const a = document.createElement('a');
        a.href = rec.dataUrl;
        a.download = rec.fileName || 'document';
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (e) {
        showToast('เปิดไฟล์ไม่สำเร็จ');
      }
    }

    function removeAttachedFile(friendId, fileId) {
      const f = friends.find(x => x.id === friendId);
      if (!f || !Array.isArray(f.files)) return;
      f.files = f.files.filter(x => x.fileId !== fileId);
      saveData('ลบไฟล์แนบออกแล้ว');
    }

    function toggleCheck(id, key, checked) {
      const f = friends.find(x => x.id === id);
      if (!f) return;
      const set = new Set(Array.isArray(f.checklist) ? f.checklist : []);
      if (checked) set.add(key); else set.delete(key);
      f.checklist = Array.from(set);
      saveData(`✨ อัปเดตเช็กลิสต์ของ ${shortName(f.name)} แล้วจ้า!`);
    }

    function togglePitfall(id, key, checked) {
      const f = friends.find(x => x.id === id);
      if (!f) return;
      const set = new Set(Array.isArray(f.pitfalls) ? f.pitfalls : []);
      if (checked) set.add(key); else set.delete(key);
      f.pitfalls = Array.from(set);
      saveData(`🛡️ อัปเดตการตรวจจุดตาย DPA แล้ว (${f.pitfalls.length}/6 ข้อ)`);
    }

    function addTag(val) {
      const el = document.getElementById('f-innovation');
      if (!el.value.trim()) el.value = val;
      else if (!el.value.includes(val)) el.value = `${el.value.trim()} + ${val}`;
    }

    function openFriendModal(id) {
      const f = id ? friends.find(x => x.id === id) : null;
      document.getElementById('modal-title').textContent = f ? `✏️ แก้ไขข้อมูล: ${f.name}` : '🌸 เพิ่มข้อมูลเพื่อนครู';
      document.getElementById('f-id').value = f ? f.id : '';
      document.getElementById('f-name').value = f ? f.name : '';
      document.getElementById('f-school').value = f ? (f.school || '') : '';
      document.getElementById('f-rank').value = f ? (f.rank || 'ค.ศ.2') : 'ค.ศ.2';
      document.getElementById('f-date').value = f ? (f.targetDate || '') : new Date().toISOString().slice(0, 10);
      document.getElementById('f-contact').value = f ? (f.contact || '') : '';
      document.getElementById('f-status').value = f ? (f.status || 'รอถึงกำหนด') : 'รอถึงกำหนด';
      document.getElementById('f-subject').value = f ? (f.subject || '') : '';
      document.getElementById('f-grade').value = f ? (f.grade || '') : '';
      document.getElementById('f-topic').value = f ? (f.topic || '') : '';
      document.getElementById('f-innovation').value = f ? (f.innovation || '') : '';
      document.getElementById('f-notes').value = f ? (f.notes || '') : '';

      const links = (f && f.links) ? f.links : { drive: '', plan: '', video: '' };
      document.getElementById('f-link-drive').value = links.drive || '';
      document.getElementById('f-link-plan').value = links.plan || '';
      document.getElementById('f-link-video').value = links.video || '';

      const chk = f && Array.isArray(f.checklist) ? f.checklist : [];
      document.getElementById('c-plan').checked = chk.includes('แผนการสอน');
      document.getElementById('c-video').checked = chk.includes('คลิปการสอน');
      document.getElementById('c-outcome').checked = chk.includes('ผลลัพธ์ผู้เรียน');
      document.getElementById('c-pa').checked = chk.includes('ระบบ PA/DPA');

      document.getElementById('btn-del').style.display = f ? 'inline-flex' : 'none';
      document.getElementById('friend-modal').classList.add('open');
    }

    function closeFriendModal() {
      document.getElementById('friend-modal').classList.remove('open');
    }

    function saveFriendForm(e) {
      e.preventDefault();
      const id = document.getElementById('f-id').value || `friend_${Date.now()}`;
      const existing = friends.find(x => x.id === id);
      const checklist = [];
      if (document.getElementById('c-plan').checked) checklist.push('แผนการสอน');
      if (document.getElementById('c-video').checked) checklist.push('คลิปการสอน');
      if (document.getElementById('c-outcome').checked) checklist.push('ผลลัพธ์ผู้เรียน');
      if (document.getElementById('c-pa').checked) checklist.push('ระบบ PA/DPA');

      const item = {
        id,
        name: document.getElementById('f-name').value.trim(),
        school: document.getElementById('f-school').value.trim(),
        rank: document.getElementById('f-rank').value,
        targetDate: document.getElementById('f-date').value,
        contact: document.getElementById('f-contact').value.trim(),
        status: document.getElementById('f-status').value,
        subject: document.getElementById('f-subject').value.trim(),
        grade: document.getElementById('f-grade').value.trim(),
        topic: document.getElementById('f-topic').value.trim(),
        innovation: document.getElementById('f-innovation').value.trim(),
        links: {
          drive: document.getElementById('f-link-drive').value.trim(),
          plan: document.getElementById('f-link-plan').value.trim(),
          video: document.getElementById('f-link-video').value.trim()
        },
        files: existing && Array.isArray(existing.files) ? existing.files : [],
        pitfalls: existing && Array.isArray(existing.pitfalls) ? existing.pitfalls : [],
        timeline: existing && Array.isArray(existing.timeline) ? existing.timeline : [
          { date: nowThaiStamp(), text: '🌸 เริ่มสร้างสมุดที่ปรึกษาให้เพื่อน' }
        ],
        checklist,
        notes: document.getElementById('f-notes').value.trim()
      };

      const idx = friends.findIndex(x => x.id === id);
      if (idx >= 0) friends[idx] = item; else friends.push(item);
      activeTab = item.id;
      closeFriendModal();
      saveData(`🌸 บันทึกและเปิดหน้าของ ${shortName(item.name)} แล้วจ้า!`);
    }

    function deleteCurrentFriend() {
      const id = document.getElementById('f-id').value;
      const f = friends.find(x => x.id === id);
      if (!f) return;
      if (!confirm(`ต้องการลบรายชื่อ "${f.name}" ใช่ไหมครับ?`)) return;
      friends = friends.filter(x => x.id !== id);
      activeTab = 'overview';
      closeFriendModal();
      saveData(`ลบรายชื่อ ${f.name} แล้ว`);
    }

    // 4-Mode Message Generator
    function openMsgModal(id) {
      activeMsgFriendId = id;
      currentMsgMode = 1;
      updateMsgPreview();
      document.getElementById('msg-modal').classList.add('open');
    }

    function setMsgMode(mode) {
      currentMsgMode = mode;
      [1, 2, 3, 4].forEach(m => {
        const btn = document.getElementById(`mm-${m}`);
        if (m === mode) btn.classList.add('active'); else btn.classList.remove('active');
      });
      updateMsgPreview();
    }

    function updateMsgPreview() {
      const f = friends.find(x => x.id === activeMsgFriendId);
      if (!f) return;
      const d = getDaysUntil(f.targetDate);
      const tDate = formatThaiDate(f.targetDate);
      const rankTxt = f.rank === 'ค.ศ.3' ? 'ค.ศ.3 (ชำนาญการพิเศษ)' : 'ค.ศ.2 (ชำนาญการ)';
      const chk = Array.isArray(f.checklist) ? f.checklist : [];
      const pitfalls = Array.isArray(f.pitfalls) ? f.pitfalls : [];

      let text = '';
      if (currentMsgMode === 1) {
        const timeTxt = d < 0
          ? `เห็นว่าครบกำหนดยื่น ${rankTxt} ตั้งแต่วันที่ ${tDate} แล้วนะ!`
          : `เห็นที่คุยกันไว้ว่าจะครบกำหนดยื่น ${rankTxt} วันที่ ${tDate} (อีก ${d} วัน) นี้แล้ว!`;
        text = `สวัสดีครับ ${f.name}! 😊🌸\n${timeTxt}\n\nเลยแวะมาทักถามความคืบหน้าหน่อยครับ จะได้ช่วยกันวางแผนถูก:\n1️⃣ เล็งไว้หรือยังว่าจะทำเรื่องอะไร / หน่วยการเรียนรู้ไหน?\n2️⃣ เลือกอัดคลิปสอนนักเรียนระดับชั้นไหน?\n3️⃣ กะว่าจะใช้นวัตกรรม สื่อ หรือวิธีการสอนแบบไหนเป็นตัวชูโรง? (เช่น Active Learning, GPAS 5 Steps, PBL, บอร์ดเกม ฯลฯ)\n\nว่างแล้วพิมพ์บอกไว้ได้เลยนะ เดี๋ยวจดไว้ในสมุดที่ปรึกษาให้ครับ! ✌🏻✨🟢`;
      } else if (currentMsgMode === 2) {
        const missingDocs = CHECKLIST_OPTS.filter(c => !chk.includes(c.key)).map(c => c.label).join(', ');
        text = `สวัสดีครับ ${f.name}! 😊✨\nแวะมาอัปเดตความคืบหน้าเรื่องทำ ${rankTxt} ${f.topic ? `เรื่อง "${f.topic}"` : ''} ${f.grade ? `(ชั้น ${f.grade})` : ''} ครับ!\n\nตอนนี้รายการที่กำลังลุยต่อคือ: ${missingDocs || 'เตรียมความพร้อมขั้นสุดท้าย'}\nถ้าทำไฟล์แผนการสอนหรืออัดคลิปเสร็จแล้ว ส่งลิงก์ Google Drive หรือส่งไฟล์มาให้ช่วยสแกนดูได้เลยนะครับ สู้ๆ ครับ! ✌🏻🌸`;
      } else if (currentMsgMode === 3) {
        const uncheckedPitfalls = DPA_PITFALLS.filter(p => !pitfalls.includes(p.key)).map(p => `• ${p.label}`).join('\n');
        text = `สวัสดีครับ ${f.name}! 🔍✨\nผมช่วยเช็กงานสำหรับยื่น ${rankTxt} ให้เบื้องต้นแล้วนะครับ (${pitfalls.length}/6 จุดสำคัญ)\n\n${uncheckedPitfalls ? `จุดที่อยากให้ลองเช็กเพิ่มอีกนิดก่อนยื่นครับ:\n${uncheckedPitfalls}` : '🎉 เช็กครบทั้ง 6 จุดสำคัญของ DPA แล้ว ผ่านฉลุยเลยครับ!'}\n\n${f.notes ? `หมายเหตุเพิ่มเติม: ${f.notes}\n` : ''}ปรับเสร็จแล้วส่งมาให้ดูอีกรอบได้ตลอดเลยนะครับ! ✌🏻🟢`;
      } else {
        text = `สวัสดีครับ ${f.name}! 🎉🍀\nขอส่งกำลังใจให้สำหรับการยื่นขอ ${rankTxt} ในระบบ DPA นะครับ! เตรียมงานมาตั้งใจขนาดนี้ ขอให้กรรมการอ่านแผนดูคลิปแล้วประทับใจ ได้ขึ้น "ป้ายเขียวอนุมัติ" ไวๆ เลยนะครับ ลุ้นไปด้วยกันครับ! 🟢✨🎉✌🏻`;
      }

      document.getElementById('msg-box').textContent = text;
    }

    function closeMsgModal() {
      document.getElementById('msg-modal').classList.remove('open');
    }

    function editFromMsgModal() {
      closeMsgModal();
      if (activeMsgFriendId) openFriendModal(activeMsgFriendId);
    }

    function copyChatMsg() {
      const txt = document.getElementById('msg-box').textContent;
      navigator.clipboard.writeText(txt).then(() => showToast('📋 คัดลอกข้อความส่งแชทเรียบร้อยแล้ว!')).catch(() => showToast('คัดลอกแล้ว!'));
    }

    function esc(s) {
      if (!s) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    loadData();
  </script>
</body>
</html>
